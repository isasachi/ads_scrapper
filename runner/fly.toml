# fly.toml app configuration file generated for ads-scrapper-runner on 2026-06-02T17:16:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ads-scrapper-runner'
primary_region = 'ord'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
